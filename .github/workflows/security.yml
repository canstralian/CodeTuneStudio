name: Security Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Semgrep Audit
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Semgrep audit
        run: |
          semgrep scan \
            --config p/security-audit \
            --exclude venv \
            --exclude .venv \
            --exclude node_modules \
            --exclude dist \
            --sarif \
            --output semgrep-results.sarif \
            --error
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
      - name: Upload Semgrep artifact
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-${{ github.run_id }}
          path: semgrep-results.sarif
          retention-days: 30
          if-no-files-found: ignore

  gitleaks:
    name: Gitleaks Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Gitleaks audit
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --redact \
            --report-format=sarif \
            --report-path=/repo/audit-results.sarif \
            --exit-code=1
      - name: Upload audit artifact
        if: always() && hashFiles('audit-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: audit-sarif-${{ github.run_id }}
          path: audit-results.sarif
          retention-days: 30
          if-no-files-found: ignore
